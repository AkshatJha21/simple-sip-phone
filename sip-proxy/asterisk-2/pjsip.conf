; =============================================================================
; ASTERISK 2 - PJSIP Configuration
; =============================================================================
; This Asterisk instance handles extensions 2000-2999

; =============================================================================
; TRANSPORTS
; =============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; =============================================================================
; EXTENSIONS 2000-2005 (example users)
; =============================================================================

; --- Extension 2001 ---
[2001]
type=endpoint
context=internal
disallow=all
allow=opus
allow=ulaw
transport=transport-udp
aors=2001
auth=2001-auth
webrtc=yes

[2001-auth]
type=auth
auth_type=userpass
username=2001
password=secret2001

[2001]
type=aor
max_contacts=5
remove_existing=no

