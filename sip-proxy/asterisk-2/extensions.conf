; =============================================================================
; ASTERISK 2 - Dialplan (Extensions Configuration)
; =============================================================================
; This Asterisk instance handles extensions 2000-2999

[general]
static=yes
writeprotect=no

; =============================================================================
; INTERNAL CONTEXT - For registered SIP users
; =============================================================================

[internal]
; Extensions 2000-2999 are handled by this Asterisk
exten => _2XXX,1,NoOp(Call to ${EXTEN} on Asterisk-2)
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN},30,tT)
 same => n,Hangup()

; Extensions 1000-1999 should be proxied through Kamailio
exten => _1XXX,1,NoOp(Call to ${EXTEN} - should go to Asterisk-1)
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; Catch-all
exten => _X.,1,NoOp(Unknown extension ${EXTEN})
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; Handle hangup
exten => h,1,NoOp(Call ended)
