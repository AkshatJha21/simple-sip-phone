; =============================================================================
; ASTERISK 1 - Dialplan (Extensions Configuration)
; =============================================================================
; This file defines what happens when someone dials an extension.
;
; Key concepts:
; - context: A group of related extensions
; - exten: An extension rule (pattern => action)
; - Dial(): The application that makes the call
;
; Format: exten => pattern,priority,application(args)
;   pattern: What was dialed (can include wildcards)
;   priority: Order of execution (1, 2, 3... or n for next)
;   application: What to do (Dial, Hangup, Playback, etc.)

[general]
static=yes
writeprotect=no

; =============================================================================
; INTERNAL CONTEXT - For registered SIP users
; =============================================================================

[internal]
; Extensions 1000-1999 are handled by this Asterisk
; The _1XXX pattern matches any 4-digit number starting with 1
exten => _1XXX,1,NoOp(Call to ${EXTEN} on Asterisk-1)
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN},30,tT)
 same => n,Hangup()

; Extensions 2000-2999 should be proxied through Kamailio
; But if they come here directly (misconfiguration), handle gracefully
exten => _2XXX,1,NoOp(Call to ${EXTEN} - should go to Asterisk-2)
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; Catch-all for other extensions
exten => _X.,1,NoOp(Unknown extension ${EXTEN})
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; Handle hangup
exten => h,1,NoOp(Call ended)
