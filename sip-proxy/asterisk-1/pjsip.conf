; =============================================================================
; ASTERISK 1 - PJSIP Configuration
; =============================================================================
; This Asterisk instance handles extensions 1000-1999
;
; Key concepts:
; - endpoint: Defines a SIP device/user
; - auth: Authentication credentials
; - aor: Address of Record - where to find the device
; - transport: How SIP messages are sent (UDP, TCP, WSS)

; =============================================================================
; TRANSPORTS
; =============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; =============================================================================
; EXTENSIONS 1000-1005 (example users)
; =============================================================================

; --- Extension 1001 ---
[1001]
type=endpoint
context=internal
disallow=all
allow=opus
allow=ulaw
transport=transport-udp
aors=1001
auth=1001-auth
webrtc=yes

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=secret1001

[1001]
type=aor
max_contacts=5
remove_existing=no

