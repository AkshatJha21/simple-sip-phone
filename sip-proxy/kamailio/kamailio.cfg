#!KAMAILIO
#
# Kamailio SIP Proxy Configuration
# ================================
# This configuration sets up Kamailio as a SIP proxy that:
# 1. Accepts SIP traffic on UDP, TCP, and WebSocket
# 2. Queries a Node.js API to determine call routing
# 3. Forwards calls to the appropriate Asterisk server
#
# Key Concepts:
# - request_route: Main entry point for all SIP requests
# - INVITE: The SIP message that initiates a call
# - REGISTER: The SIP message for user registration
# - Record-Route: Ensures subsequent messages go through the proxy

####### Global Parameters #########

# Print debug messages to stderr (useful for development)
debug=2
log_stderror=yes

# Memory and process settings
memdbg=5
memlog=5
children=4

# Listen on multiple transports
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tls:0.0.0.0:5061

# WebSocket for browser softphones
listen=tcp:0.0.0.0:8080

# Disable TCP for now to simplify (enable in production)
# auto_aliases=no

####### Modules Section ########

# Load core modules
loadmodule "kex.so"           # Kamailio extensions
loadmodule "corex.so"         # Core extensions  
loadmodule "tm.so"            # Transaction module
loadmodule "tmx.so"           # Transaction extensions
loadmodule "sl.so"            # Stateless replies
loadmodule "rr.so"            # Record-Route
loadmodule "pv.so"            # Pseudo-variables
loadmodule "maxfwd.so"        # Max-Forwards check
loadmodule "textops.so"       # Text operations
loadmodule "siputils.so"      # SIP utilities
loadmodule "xlog.so"          # Extended logging
loadmodule "sanity.so"        # SIP sanity checks
loadmodule "ctl.so"           # Control interface
loadmodule "jsonrpcs.so"      # JSON-RPC server

# HTTP client - for querying Node.js router API
loadmodule "http_client.so"

# WebSocket support
loadmodule "xhttp.so"
loadmodule "websocket.so"

# JSON parsing (for API responses)
loadmodule "jansson.so"

####### Module Parameters ########

# Transaction module settings
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

# Record-Route settings
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 0)

# HTTP client settings
modparam("http_client", "connection_timeout", 2000)
modparam("http_client", "httpcon", "router=>http://node-router:3000")

# WebSocket settings
modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_timeout", 30)

####### Routing Logic ########

# Main request routing block
# This is called for every SIP request that arrives
request_route {
    # Log the incoming request
    xlog("L_INFO", "=== Incoming $rm from $fu to $ru ===\n");

    # Sanity check - reject malformed messages
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP message from $si:$sp\n");
        exit;
    }

    # Max-Forwards check - prevent infinite loops
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # Handle OPTIONS requests (keepalives)
    if (is_method("OPTIONS") && uri==myself) {
        sl_send_reply("200", "OK");
        exit;
    }

    # Handle requests within existing dialogs (in-dialog requests)
    # These are follow-up messages for calls already in progress
    if (has_totag()) {
        if (loose_route()) {
            # In-dialog request - route it normally
            route(RELAY);
            exit;
        }
        
        if (is_method("ACK")) {
            if (t_check_trans()) {
                route(RELAY);
                exit;
            }
            exit;
        }
        
        sl_send_reply("404", "Not Found");
        exit;
    }

    # Cancel handling
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # Reject unsupported methods
    if (!is_method("INVITE|ACK|BYE|CANCEL|REGISTER|OPTIONS|INFO|UPDATE")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    # ========================================
    # REGISTRATION HANDLING
    # ========================================
    # For now, we pass REGISTER to Asterisk
    # In production, you might handle registration in Kamailio
    if (is_method("REGISTER")) {
        route(ROUTE_TO_ASTERISK);
        exit;
    }

    # ========================================
    # INVITE HANDLING - This is where calls start
    # ========================================
    if (is_method("INVITE")) {
        # Add Record-Route so all future messages come through us
        record_route();
        
        # Query Node.js API for routing decision
        route(QUERY_ROUTER);
        exit;
    }

    # Default: relay the request
    route(RELAY);
}

# ========================================
# QUERY_ROUTER - Ask Node.js where to send the call
# ========================================
route[QUERY_ROUTER] {
    # Extract the called number (user part of Request-URI)
    $var(called) = $rU;
    
    xlog("L_INFO", "Querying router for destination: $var(called)\n");

    # Make HTTP POST to Node.js router
    # The router will tell us which Asterisk server to use
    $var(body) = '{"called":"' + $var(called) + '","caller":"' + $fU + '"}';
    
    if (http_client_query("router/route", $var(body), "application/json", "$var(response)")) {
        xlog("L_INFO", "Router response: $var(response)\n");
        
        # Parse JSON response
        # Expected format: {"host":"asterisk-1","port":5060}
        jansson_get("host", $var(response), "$var(dest_host)");
        jansson_get("port", $var(response), "$var(dest_port)");
        
        if ($var(dest_host) != $null) {
            # Rewrite the Request-URI to point to the correct Asterisk
            $ru = "sip:" + $rU + "@" + $var(dest_host) + ":" + $var(dest_port);
            xlog("L_INFO", "Routing call to: $ru\n");
            route(RELAY);
            exit;
        }
    }
    
    # Router failed or returned no destination
    xlog("L_ERR", "Router query failed for $var(called)\n");
    sl_send_reply("503", "Service Unavailable");
    exit;
}

# ========================================
# ROUTE_TO_ASTERISK - Default Asterisk routing
# ========================================
route[ROUTE_TO_ASTERISK] {
    # For REGISTER and other requests, route to first Asterisk by default
    # In production, you'd query the router API here too
    $ru = "sip:" + $rU + "@asterisk-1:5060";
    route(RELAY);
}

# ========================================
# RELAY - Forward the request
# ========================================
route[RELAY] {
    # Enable failure handling
    t_on_failure("HANDLE_FAILURE");
    
    # Forward the request
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# ========================================
# HANDLE_FAILURE - Called when forwarding fails
# ========================================
failure_route[HANDLE_FAILURE] {
    xlog("L_WARN", "Call failed: $T_reply_code $T_reply_reason\n");
    
    # You could implement failover to another Asterisk here
    # For now, just let the failure propagate
}

# ========================================
# Reply route - for responses
# ========================================
reply_route {
    xlog("L_INFO", "=== Reply $rs $rr ===\n");
}

# ========================================
# WebSocket handling
# ========================================
event_route[xhttp:request] {
    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade") {
        xlog("L_INFO", "WebSocket connection request\n");
        
        if (ws_handle_handshake()) {
            exit;
        }
    }
    
    xhttp_reply("404", "Not Found", "text/plain", "Not Found");
}
